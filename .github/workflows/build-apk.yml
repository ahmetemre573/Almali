
name: Almalı Beta Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK platformunu kur
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Hesaplama testlerini çalıştır
        run: |
          mkdir -p tmp-tests
          javac -encoding UTF-8 -d tmp-tests app/src/main/java/com/almali/app/RepeatCalculator.java app/src/main/java/com/almali/app/PriceRules.java tests/RepeatCalculatorTest.java tests/PriceRulesTest.java
          java -cp tmp-tests RepeatCalculatorTest
          java -cp tmp-tests PriceRulesTest

      - name: APK oluştur
        run: gradle --no-daemon assembleDebug

      - name: APK dosyasını indirilebilir hale getir
        uses: actions/upload-artifact@v4
        with:
          name: almali-beta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
