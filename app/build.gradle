plugins {
    id 'com.android.application'
}

android {
    namespace 'com.almali.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.almali.app.beta'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-beta'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zamanlanmış ağ erişimi; Android Doze nedeniyle kesin saat garantisi vermez.
dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
}
